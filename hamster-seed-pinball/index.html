<script>
"use strict";
/* ============ 基础 ============ */
const W = 420, H = 640;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
/* 画布按实际显示尺寸 × 设备像素比渲染：显示多大就画多清，字不糊 */
function fitCanvas(){
  try{
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const bw = Math.max(1080, Math.min(1680, Math.floor(r.width * dpr)));
    if(cv.width !== bw){ cv.width = bw; cv.height = Math.round(H * bw / W); }
    ctx.setTransform(bw / W, 0, 0, bw / W, 0, 0);
  }catch(e){}
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

const $ = id => document.getElementById(id);
const COIN_SVG = '<svg viewBox="0 0 48 48" width="1.15em" height="1.15em" style="vertical-align:-0.18em" aria-label="吱吱币"><circle cx="24" cy="24" r="20.5" fill="#f7b731" stroke="#b97a1a" stroke-width="3"/><circle cx="24" cy="24" r="15.8" fill="#ffd964"/><circle cx="15.5" cy="14.5" r="4.6" fill="#eda93f" stroke="#b97a1a" stroke-width="1.4"/><circle cx="32.5" cy="14.5" r="4.6" fill="#eda93f" stroke="#b97a1a" stroke-width="1.4"/><circle cx="15.5" cy="14.5" r="2.1" fill="#f6c9c0"/><circle cx="32.5" cy="14.5" r="2.1" fill="#f6c9c0"/><ellipse cx="24" cy="26.5" rx="10.6" ry="9.2" fill="#f6d493"/><circle cx="16.8" cy="29.5" r="2.6" fill="#f9b8a0" opacity="0.65"/><circle cx="31.2" cy="29.5" r="2.6" fill="#f9b8a0" opacity="0.65"/><circle cx="19.8" cy="24.8" r="1.8" fill="#4a2c0a"/><circle cx="28.2" cy="24.8" r="1.8" fill="#4a2c0a"/><ellipse cx="24" cy="30" rx="4.8" ry="3.4" fill="#fff3d6"/><ellipse cx="24" cy="28.4" rx="1.7" ry="1.2" fill="#e2707a"/><rect x="23" y="31.6" width="2" height="2.4" rx="0.7" fill="#ffffff" stroke="#d9c9a8" stroke-width="0.5"/></svg>';
const scoreEl=$('score'), seedsEl=$('seeds'), bestEl=$('best'), fillEl=$('storefill'),
      nextEl=$('nextinfo'), liveDot=$('livedot'), liveText=$('livetext'),
      bannerEl=$('banner'), cheeksEl=$('cheeks'), cheekCap=$('cheekcap'),

function addPeg(x, y){
  if(x < 26 || x > W-26 || y < 104 || y > 498) return;
  if(Math.hypot(x-WHEEL.x, y-WHEEL.y) < WHEEL.r + 24) return;
  for(const s of MAPS[currentMap].spinners) if(Math.hypot(x-s.x, y-s.y) < 40) return;
  for(const p of POCKETS) if(Math.hypot(x-p.x, y-p.y) < 34) return;
  for(const pg of pegs) if(Math.hypot(x-pg.x, y-pg.y) < 19) return;
  pegs.push({x:x, y:y, r:7, hit:0});
}
function buildBoard(){
  pegs = []; rng = mulberry32(boardSeed);
  const gen = MAPS[currentMap].gen;
  if(gen === 'grid'){
    for(let row=0; row<7; row++){
      const y = 128 + row*46, n = (row%2===0)? 6 : 5;
      for(let i=0;i<n;i++){
        addPeg(42 + i*((W-84)/(n-1)) + (rng()-0.5)*14, y + (rng()-0.5)*8);
      }
    }
  } else if(gen === 'valley'){
    for(let t=0; t<7; t++){
      const y = 138 + t*36;
      addPeg(50 + t*21 + (rng()-0.5)*7, y);
      addPeg(W-50 - t*21 + (rng()-0.5)*7, y);
    }
    for(let i=0;i<6;i++) addPeg(52 + i*63 + (rng()-0.5)*8, 448 + (rng()-0.5)*6);
    for(let i=0;i<5;i++) addPeg(84 + i*63 + (rng()-0.5)*8, 484 + (rng()-0.5)*6);
    addPeg(210, 118); addPeg(150, 128); addPeg(270, 128);
  } else if(gen === 'rings'){
    for(let i=0;i<10;i++){
      const a = i*(Math.PI*2/10) + 0.3;
      addPeg(WHEEL.x + Math.cos(a)*106, WHEEL.y + Math.sin(a)*106);
    }
    for(let i=0;i<13;i++){
      const a = i*(Math.PI*2/13) + 0.05;
      addPeg(WHEEL.x + Math.cos(a)*148, WHEEL.y + Math.sin(a)*148);
    }
    for(let i=0;i<5;i++) addPeg(66 + i*72 + (rng()-0.5)*8, 452 + (rng()-0.5)*6);
    addPeg(120, 130); addPeg(300, 130);
  } else if(gen === 'cross'){
    for(let t=0; t<7; t++){
      addPeg(72 + t*22 + (rng()-0.5)*6, 142 + t*40);
      addPeg(W-72 - t*22 + (rng()-0.5)*6, 142 + t*40);
    }
    for(let i=0;i<5;i++){ addPeg(70 + i*30, 300 + (rng()-0.5)*6); addPeg(W-70 - i*30, 300 + (rng()-0.5)*6); }
    for(let i=0;i<4;i++) addPeg(84 + i*84 + (rng()-0.5)*8, 462 + (rng()-0.5)*6);
  } else if(gen === 'zigzag'){
    for(let row=0; row<8; row++){
      const y = 126 + row*44, off = (row % 2 === 0) ? 0 : 27;
      for(let i=0;i<6;i++) addPeg(50 + i*58 + off + (rng()-0.5)*9, y + (rng()-0.5)*6);
    }
  }
  /* 关卡越高，钉子越密 */
  const extra = Math.min(26, Math.floor((MAPS[currentMap].stage - 1) / 3) * 2);
  for(let k=0;k<extra;k++) addPeg(44 + rng()*(W-88), 122 + rng()*352);
  spinners = MAPS[currentMap].spinners.map((s,i) => ({x:s.x, y:s.y, a:i*2.1}));
}

/* 一个地址只显示一条：每个榜取该地址在这个榜上最好的一条 */
function lbView(tab){
  const better = (a, b) => {
    if(tab === 'level'){
      if((b.lv||1) !== (a.lv||1)) return (b.lv||1) > (a.lv||1) ? b : a;
      return b.s > a.s ? b : a;
    }
    if(tab === 'stage'){
      if((b.stg||1) !== (a.stg||1)) return (b.stg||1) > (a.stg||1) ? b : a;
      if((b.w||0) !== (a.w||0)) return (b.w||0) > (a.w||0) ? b : a;
      return b.s > a.s ? b : a;
    }
    return b.s > a.s ? b : a;
  };
  const byWho = new Map();
  for(const r of scoreRows){
    let k = r.wk || r.who || 'guest';
    if(k === '游客') k = 'guest';
    byWho.set(k, byWho.has(k) ? better(byWho.get(k), r) : r);
  }
  const rows = [...byWho.values()];
  if(tab === 'level') rows.sort((a,b) => (b.lv||1)-(a.lv||1) || b.s-a.s);
  else if(tab === 'stage') rows.sort((a,b) => (b.stg||1)-(a.stg||1) || (b.w||0)-(a.w||0) || b.s-a.s);
  else rows.sort((a,b) => b.s-a.s);
  return rows;
}

  const pages = Math.max(1, Math.ceil(rows.length / LB_PER_PAGE));
  if(lbPage >= pages) lbPage = pages - 1;
  if(lbPage < 0) lbPage = 0;
  const start = lbPage * LB_PER_PAGE;

let audioCtx = null, soundOn = true;
function beep(f, t, type, vol){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (t||0.08));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (t||0.08));
  }catch(e){}
}
function squeak(){ beep(1250,0.07,'sine',0.05); setTimeout(()=>beep(1650,0.09,'sine',0.05), 70); }

function endBall(b, kind, binIdx){
  if(kind === 'bin'){

      lastBin = -1; comboMult = 1; harvestReady = false;

      beep(150, 0.16, 'square', 0.05);
    } else {

      if(binIdx === 3 && ham.running) v = 200;
      if(!ham.running && ham.ok) v = Math.round(v * 1.1);
      const pts = Math.round(v * b.mult * (1 + 0.05 * meta.up.harvest));
      score += pts;
      showBanner(t('bBin')(b.golden, binName(bin), pts));
      if(binIdx === lastBin){ comboMult = 1.5; } else { comboMult = 1; }
      lastBin = binIdx;
      squeak();

    score = Math.max(0, score - 10);

/* ============ 体力（每天固定上限，随时间恢复）+ 矿场 ============ */
function stamNow(){
  if(!meta.stam) meta.stam = { v: STAM_MAX, ts: Date.now() };
  const st = meta.stam;
  if(st.v >= STAM_MAX){ st.ts = Date.now(); return st.v; }
  const gain = Math.floor((Date.now() - st.ts) / STAM_REGEN_MS);
  if(gain > 0){
    st.v = Math.min(STAM_MAX, st.v + gain);
    st.ts = st.v >= STAM_MAX ? Date.now() : st.ts + gain * STAM_REGEN_MS;
    saveMeta();
  }
  return st.v;
}
function renderStam(){
  const el = $('stamText'); if(!el) return;
  const v = stamNow();
  let txt = t('stamLab') + ' ' + v + ' / ' + STAM_MAX;

/* ============ 物理 ============ */
let wheelAngle = 0, wheelOmega = 0.004, pegThreshold = 20;
const beetle = { x:90, y:520, dir:1, stun:0 };
function physStep(dtF){
  /* 演示模式：跑/睡交替 */
  if(ham.demo){
    const cyc = (Date.now() % 24000);
    ham.running = cyc < 14000;
    ham.rpm = ham.running ? 62 + Math.sin(Date.now()/700)*14 : 0;
  }
  const targetOmega = ham.running ? Math.min(0.14, Math.max(0.02, ham.rpm/120*0.14)) : 0.004;
  wheelOmega += (targetOmega - wheelOmega) * 0.03 * dtF;
  wheelAngle += wheelOmega * dtF;
  for(const s of spinners) s.a += (0.025 + wheelOmega*0.6) * dtF;

  /* 捣蛋甲虫巡逻（仓鼠狂奔时它也更急；防虫喷雾让它变慢） */
  if(beetle.stun > 0){ beetle.stun -= dtF; }
  else {
    const bSpeed = (ham.running ? 2.0 : 1.15) * (1 - 0.25 * meta.up.spray) * MAPS[currentMap].beetleMult;
    beetle.x += beetle.dir * bSpeed * dtF;
    if(beetle.x > W-36){ beetle.x = W-36; beetle.dir = -1; }
    if(beetle.x < 36){ beetle.x = 36; beetle.dir = 1; }
  }

  for(const b of [...balls]) stepBall(b, dtF);
}
function stepBall(b, dtF){
  b.vy += 0.21 * dtF * (ham.running ? 1 : 0.82);
  b.vx *= 0.999; b.vy *= 0.999;
  b.x += b.vx * dtF; b.y += b.vy * dtF;

  /* 墙 */
  if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx)*0.55; }
  if(b.x > W-b.r){ b.x = W-b.r; b.vx = -Math.abs(b.vx)*0.55; }
  if(b.y < b.r+6){ b.y = b.r+6; b.vy = Math.abs(b.vy)*0.4; }

  /* 颊囊口袋 */
  for(const p of POCKETS){
    if(Math.hypot(b.x-p.x, b.y-p.y) < 15){ endBall(b, 'pocket'); return; }
  }
  /* 捣蛋甲虫抢种子 */
  if(Math.hypot(b.x-beetle.x, b.y-beetle.y) < b.r + 13){ endBall(b, 'stolen'); return; }
  /* 橡子钉 */
  for(const pg of pegs){
    const dx = b.x-pg.x, dy = b.y-pg.y, d = Math.hypot(dx,dy), min = b.r+pg.r;
    if(d > 0 && d < min){
      const nx = dx/d, ny = dy/d;
      b.x = pg.x + nx*min; b.y = pg.y + ny*min;
      const vn = b.vx*nx + b.vy*ny;
      if(vn < 0){
        b.vx -= 1.72*vn*nx; b.vy -= 1.72*vn*ny;
        b.vx += (Math.random()-0.5)*0.14;
        pg.hit = 6; b.pegTouch++; pegHits++;
        beep(880 + Math.random()*320, 0.045, 'sine', 0.028);
        if(pegHits >= pegThreshold){
          pegThreshold += 20; harvestReady = true;
          showBanner(t('bHarvest')); squeak();
        }
      }
    }
  }
  /* 胡萝卜风车针（加长版：半长 26，按旋转线段算碰撞） */
  const SPIN_LEN = 26, SPIN_OMEGA = 0.025 + wheelOmega*0.6;
  for(const s of spinners){
    const ux = Math.cos(s.a), uy = Math.sin(s.a);
    const ax = s.x - ux*SPIN_LEN, ay = s.y - uy*SPIN_LEN;
    const abx = ux*SPIN_LEN*2, aby = uy*SPIN_LEN*2;
    const tt = Math.max(0, Math.min(1, ((b.x-ax)*abx + (b.y-ay)*aby) / (SPIN_LEN*SPIN_LEN*4)));
    const px = ax + abx*tt, py = ay + aby*tt;
    const dx = b.x-px, dy = b.y-py, d = Math.hypot(dx,dy), min = b.r+5;
    if(d > 0.01 && d < min){
      const nx = dx/d, ny = dy/d;
      b.x = px + nx*min; b.y = py + ny*min;
      const vn = b.vx*nx + b.vy*ny;
      if(vn < 0){ b.vx -= 1.8*vn*nx; b.vy -= 1.8*vn*ny; }
      /* 针转动的切向甩力：离中心越远甩得越狠 */
      const qx = px - s.x, qy = py - s.y;
      b.vx += -qy * SPIN_OMEGA * 0.55; b.vy += qx * SPIN_OMEGA * 0.55;
      beep(520, 0.05, 'triangle', 0.04);
    } else if(d <= 0.01){
      b.vy += 1.2; b.vx += (Math.random()<0.5?-1:1)*0.8;
    }
  }
  /* 大跑轮：轮缘碰撞 + 切向甩力 */
  {
    const dx = b.x-WHEEL.x, dy = b.y-WHEEL.y, d = Math.hypot(dx,dy), min = b.r+WHEEL.r;
    if(d > 0 && d < min){
      const nx = dx/d, ny = dy/d;
      b.x = WHEEL.x + nx*min; b.y = WHEEL.y + ny*min;
      const vn = b.vx*nx + b.vy*ny;
      if(vn < 0){ b.vx -= 1.8*vn*nx; b.vy -= 1.8*vn*ny; }
      const tx = -ny, ty = nx, surf = wheelOmega * WHEEL.r;
      b.vx += tx * surf * 0.55; b.vy += ty * surf * 0.55;
      if(Math.abs(wheelOmega) > 0.03) beep(340, 0.06, 'sawtooth', 0.02);
    }
  }
  /* 粮仓隔板（竖段） */
  for(let i=1;i<BINS.length;i++){
    const x = i*BIN_W;
    if(b.y > BIN_TOP-6 && Math.abs(b.x-x) < b.r+2.5 && b.y < H-14){
      if(b.x < x){ b.x = x-b.r-2.5; b.vx = -Math.abs(b.vx)*0.5; }
      else { b.x = x+b.r+2.5; b.vx = Math.abs(b.vx)*0.5; }
    }
  }
  /* 落格 */
  if(b.y > H-30){
    const idx = Math.max(0, Math.min(BINS.length-1, Math.floor(b.x/BIN_W)));
    endBall(b, 'bin', idx); return;
  }
  /* 防卡死 */
  const sp = Math.hypot(b.vx, b.vy);
  if(sp < 0.32){ b.still += dtF; if(b.still > 80){ b.vx += (Math.random()<0.5?-1:1)*1.1; b.vy -= 0.6; b.still = 0; } }
  else b.still = 0;
  if(performance.now() - b.born > 15000){ endBall(b, 'lost'); }
}

    ctx.fillStyle = 'rgba(247,183,49,.20)';
    ctx.beginPath(); ctx.arc(210, 60, 130, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(190,140,40,.55)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for(let wx=14; wx<W-6; wx+=17){
      const base = 544, sway = Math.sin(wx*1.7)*3;
      ctx.beginPath(); ctx.moveTo(wx, base); ctx.quadraticCurveTo(wx+sway, base-24, wx+sway*1.6, base-40); ctx.stroke();
      ctx.fillStyle = 'rgba(222,170,60,.8)';
      for(let gLine=0; gLine<3; gLine++){
        const gy = base - 26 - gLine*6, gx = wx + sway*1.2 + gLine*sway*0.2;
        ctx.beginPath(); ctx.ellipse(gx-4, gy, 4.6, 2.2, -0.6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(gx+4, gy, 4.6, 2.2, 0.6, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  /* 顶部区块进度 */
  ctx.fillStyle = 'rgba(120,80,30,.25)'; ctx.fillRect(0,0,W,5);
  ctx.fillStyle = '#7ddc5a'; ctx.fillRect(0,0,W*Math.max(0,Math.min(1,ham.progress)),5);

  /* 左上小木屋（躲避屋） */
  ctx.save(); ctx.translate(6,8); ctx.globalAlpha = 0.92;
  ctx.fillStyle = '#b07a3f'; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(26,4); ctx.lineTo(52,20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cf9a58'; ctx.fillRect(6,20,40,24);
  ctx.fillStyle = '#6b3d07'; ctx.beginPath(); ctx.arc(26,44,8,Math.PI,0); ctx.fill();
  ctx.restore();
  /* 右上饮水器 */
  ctx.save(); ctx.translate(382,10); ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(165,205,230,.8)'; ctx.beginPath(); ctx.roundRect(6,0,24,42,8); ctx.fill();
  ctx.fillStyle = 'rgba(120,170,205,.9)'; ctx.fillRect(6,26,24,16);
  ctx.fillStyle = '#9aa3ab'; ctx.fillRect(0,40,10,12);
  ctx.beginPath(); ctx.arc(2,54,3,0,Math.PI*2); ctx.fillStyle = '#7d8891'; ctx.fill();
  ctx.restore();

  /* 颊囊口袋 */
  for(const p of POCKETS){
    ctx.beginPath(); ctx.arc(p.x,p.y,19,0,Math.PI*2); ctx.fillStyle = '#f2a49b'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,12.5,0,Math.PI*2); ctx.fillStyle = '#f9c6bd'; ctx.fill();
    ctx.fillStyle = '#a34a3e'; ctx.font = 'bold 10.5px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t('cPouch'), p.x, p.y+30);
  }
  /* 橡子钉 */
  for(const pg of pegs){
    if(pg.hit > 0){ pg.hit--; ctx.beginPath(); ctx.arc(pg.x,pg.y,pg.r+5,0,Math.PI*2); ctx.strokeStyle = 'rgba(255,170,40,.8)'; ctx.lineWidth = 2.4; ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(pg.x,pg.y+1.5,pg.r,pg.r+1.6,0,0,Math.PI*2); ctx.fillStyle = '#a06a2c'; ctx.fill();
    ctx.beginPath(); ctx.arc(pg.x,pg.y-2.4,pg.r*0.98,Math.PI,0); ctx.fillStyle = '#6e4520'; ctx.fill();
    ctx.fillRect(pg.x-1.1, pg.y-pg.r-4.4, 2.2, 3.6);
  }
  /* 胡萝卜风车针（加长） */
  for(const s of spinners){
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a);
    ctx.fillStyle = '#ef7d31';
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.quadraticCurveTo(7,0,0,26); ctx.quadraticCurveTo(-7,0,0,-26); ctx.fill();
    ctx.strokeStyle = 'rgba(190,90,20,.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-3.4,-12); ctx.lineTo(3.4,-12); ctx.moveTo(-3.8,2); ctx.lineTo(3.8,2); ctx.moveTo(-3,15); ctx.lineTo(3,15); ctx.stroke();
    ctx.fillStyle = '#57a047';
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(-6,-34); ctx.lineTo(0,-30); ctx.lineTo(3,-35); ctx.lineTo(6,-27); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(s.x,s.y,3.8,0,Math.PI*2); ctx.fillStyle = '#6e4520'; ctx.fill();
  }
  /* 大跑轮 */
  ctx.save(); ctx.translate(WHEEL.x, WHEEL.y);
  ctx.strokeStyle = '#8a5a28'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-WHEEL.r+8, WHEEL.r+16); ctx.lineTo(0, WHEEL.r-6); ctx.lineTo(WHEEL.r-8, WHEEL.r+16); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,WHEEL.r,0,Math.PI*2);
  ctx.strokeStyle = '#c07f35'; ctx.lineWidth = 7; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,WHEEL.r-9,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(160,110,50,.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.rotate(wheelAngle);
  ctx.strokeStyle = 'rgba(150,100,45,.65)'; ctx.lineWidth = 3.4;
  for(let i=0;i<6;i++){ const a = i*Math.PI/3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(WHEEL.r-8), Math.sin(a)*(WHEEL.r-8)); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fillStyle = '#8a5a28'; ctx.fill();
  ctx.restore();
  drawWheelHamster();

  drawBeetle();

  /* 木屑（先画，垫在粮仓格文字下面，避免划线压字） */
  ctx.strokeStyle = 'rgba(190,145,80,.8)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for(const s of shavings){ ctx.beginPath(); ctx.arc(s.x, s.y, s.l/2, s.a, s.a+2.2); ctx.stroke(); }

  /* 粮仓格 */
  for(let i=0;i<BINS.length;i++){
    const x = i*BIN_W;
    ctx.fillStyle = BINS[i].v < 0 ? 'rgba(110,125,90,.5)' : (i%2 ? 'rgba(255,246,220,.55)' : 'rgba(233,201,140,.5)');
    ctx.fillRect(x, BIN_TOP, BIN_W, H-BIN_TOP);
    if(i===3 && ham.running){ ctx.fillStyle = 'rgba(255,205,60,.4)'; ctx.fillRect(x, BIN_TOP, BIN_W, H-BIN_TOP); }
    drawBinIcon(BINS[i].icon, x+BIN_W/2, BIN_TOP+26);
    const dispV = BINS[i].v < 0 ? BINS[i].v : (i===3 && ham.running ? 200 : (ham.ok && !ham.running ? Math.round(BINS[i].v*1.1) : BINS[i].v));
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = 'bold 17px sans-serif'; ctx.strokeStyle = 'rgba(255,248,225,.92)'; ctx.lineWidth = 4;
    ctx.strokeText(String(dispV), x+BIN_W/2, BIN_TOP+58);
    ctx.fillStyle = BINS[i].v < 0 ? '#b03a2a' : '#6b3d07';
    ctx.fillText(String(dispV), x+BIN_W/2, BIN_TOP+58);
    const nm = binName(BINS[i]);
    ctx.lineWidth = 3.5;
    if(nm.indexOf(' ') > 0 && ctx.measureText(nm).width > 0 && nm.length > 6){
      ctx.font = 'bold 10.5px sans-serif';
      const sp = nm.indexOf(' '), l1 = nm.slice(0, sp), l2 = nm.slice(sp + 1);
      ctx.strokeText(l1, x+BIN_W/2, BIN_TOP+70); ctx.strokeText(l2, x+BIN_W/2, BIN_TOP+84);
      ctx.fillStyle = '#7a4d16';
      ctx.fillText(l1, x+BIN_W/2, BIN_TOP+70); ctx.fillText(l2, x+BIN_W/2, BIN_TOP+84);
    } else {
      ctx.font = 'bold 12px sans-serif';
      ctx.strokeText(nm, x+BIN_W/2, BIN_TOP+77);
      ctx.fillStyle = '#7a4d16';
      ctx.fillText(nm, x+BIN_W/2, BIN_TOP+77);
    }
  }
  ctx.strokeStyle = '#a5712e'; ctx.lineWidth = 3.4;
  for(let i=0;i<=BINS.length;i++){ ctx.beginPath(); ctx.moveTo(i*BIN_W, BIN_TOP); ctx.lineTo(i*BIN_W, H); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(0,BIN_TOP); ctx.lineTo(W,BIN_TOP); ctx.stroke();

  /* 投放仓鼠 + 瞄准线 */
  const bob = Math.sin(Date.now()/380)*2;
  if(balls.length<MAX_BALLS && ballsLeft>0 && !gameOver){
    ctx.save(); ctx.setLineDash([4,6]); ctx.strokeStyle = 'rgba(140,95,40,.45)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(aimX, 92); ctx.lineTo(aimX, 132); ctx.stroke(); ctx.restore();
  }
  drawHamsterHead(aimX, 52+bob, 0.92, !ham.running && ham.ok);
  /* 等级装扮：Lv2 围巾 · Lv3 墨镜 · Lv5 金铃铛 · Lv6 皇冠 */
  if(curLevel >= 2){
    ctx.fillStyle = '#d84a3a';
    ctx.beginPath(); ctx.roundRect(aimX-16, 52+bob+13, 32, 7, 3.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(aimX+9, 52+bob+19); ctx.lineTo(aimX+17, 52+bob+19); ctx.lineTo(aimX+13, 52+bob+30); ctx.closePath(); ctx.fill();
  }
  if(curLevel >= 3 && ham.running){
    ctx.fillStyle = '#26221f';
    ctx.beginPath(); ctx.roundRect(aimX-17, 52+bob-7.5, 34, 9, 4.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.roundRect(aimX-13, 52+bob-6, 9, 3.4, 1.7); ctx.fill();
  }
  if(curLevel >= 5){
    ctx.beginPath(); ctx.arc(aimX+15, 52+bob+23, 4.4, 0, Math.PI*2); ctx.fillStyle = '#f7b731'; ctx.fill();
    ctx.strokeStyle = '#c47f17'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(aimX+11.4, 52+bob+25); ctx.lineTo(aimX+18.6, 52+bob+25); ctx.stroke();
  }
  if(curLevel >= 6){
    ctx.fillStyle = '#ffcf3f'; ctx.strokeStyle = '#c47f17'; ctx.lineWidth = 1;
    const cy0 = 52+bob-27;
    ctx.beginPath();
    ctx.moveTo(aimX-10, cy0+8); ctx.lineTo(aimX-10, cy0); ctx.lineTo(aimX-5, cy0+5); ctx.lineTo(aimX, cy0-2);
    ctx.lineTo(aimX+5, cy0+5); ctx.lineTo(aimX+10, cy0); ctx.lineTo(aimX+10, cy0+8); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  if(meta.lamp){
    ctx.fillStyle = 'rgba(255,226,122,.15)';
    ctx.beginPath(); ctx.moveTo(aimX-4, 52+bob-11); ctx.lineTo(aimX+4, 52+bob-11); ctx.lineTo(aimX+17, 52+bob+36); ctx.lineTo(aimX-17, 52+bob+36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a4632';
    ctx.beginPath(); ctx.roundRect(aimX-15, 52+bob-20, 30, 5, 2.5); ctx.fill();
    ctx.beginPath(); ctx.arc(aimX, 52+bob-17, 5.4, 0, Math.PI*2); ctx.fillStyle = '#ffe27a'; ctx.fill();
    ctx.strokeStyle = '#c47f17'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  if(balls.length<MAX_BALLS && ballsLeft>0 && !gameOver){
    ctx.fillStyle = '#d9a05f';
    ctx.beginPath(); ctx.arc(aimX-13, 74+bob, 5, 0, Math.PI*2); ctx.arc(aimX+13, 74+bob, 5, 0, Math.PI*2); ctx.fill();
    drawSeed(aimX, 82+bob, 10, nextIsGolden(), 0.5);
  }
  /* 弹珠种子 */
  for(const b of balls){
    drawSeed(b.x, b.y, b.r+1, b.golden, Math.atan2(b.vy, b.vx)+Math.PI/2);
  }
  /* 夜场 */
  if(ham.ok && !ham.running){
    ctx.fillStyle = 'rgba(35,40,95,.16)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f5eeda';
    ctx.beginPath(); ctx.arc(376,116,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(35,40,95,.30)';
    ctx.beginPath(); ctx.arc(370,112,11,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ============ 输入 ============ */
function pointerX(e){
  const r = cv.getBoundingClientRect();
  return Math.max(26, Math.min(W-26, (e.clientX - r.left) * W / r.width));
}
cv.addEventListener('pointermove', e => { aimX = pointerX(e); });
cv.addEventListener('pointerdown', e => { aimX = pointerX(e); drop(); });
window.addEventListener('keydown', e => {
  if(e.code === 'ArrowLeft') aimX = Math.max(26, aimX-14);
  if(e.code === 'ArrowRight') aimX = Math.min(W-26, aimX+14);
  if(e.code === 'Space'){ e.preventDefault(); drop(); }
  if(e.code === 'KeyR') startRun();
});
dropBtn.addEventListener('click', drop);
$('restartBtn').addEventListener('click', startRun);
$('againBtn').addEventListener('click', startRun);
$('nextBtn').addEventListener('click', () => { if(currentMap < MAPS.length - 1) switchMap(currentMap + 1); });
$('soundBtn').addEventListener('click', function(){ soundOn = !soundOn; this.textContent = soundOn ? t('soundOn') : t('soundOff'); });
$('langBtn').addEventListener('click', () => { LANG = LANG === 'en' ? 'zh' : 'en'; try{ localStorage.setItem('hsb_lang', LANG); }catch(e){} applyLang(); });
$('helpBtn').addEventListener('click', () => { location.href = 'guide.html'; });

/* ============ 主循环 ============ */
let lastT = performance.now();
function loop(t){
  const dtF = Math.min(2.2, (t - lastT)/16.67); lastT = t;
  physStep(dtF);
  draw();
  requestAnimationFrame(loop);
}
refreshHUD();
if(LANG === 'en') applyLang();
requestAnimationFrame(loop);
</script>
</body>
</html>
