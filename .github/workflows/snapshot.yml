name: LEAF Snapshot

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run snapshot
        run: python3 scripts/snapshot_updater.py

      - name: Commit and push
        run: |
          git config user.name "leaf-bot"
          git config user.email "leaf-bot@users.noreply.github.com"
          git add holders.json scripts/ledger_snapshot.json scripts/trade_history.json scripts/activity_history.json scripts/staking_status.json
          git diff --cached --quiet || git commit -m "Auto snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
