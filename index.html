<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAF 持仓榜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:24px 16px;text-align:center;border-bottom:1px solid #334155}
.header h1{font-size:28px;margin-bottom:8px}
.header h1 span{color:#4ade80}
.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:#94a3b8}
.stats b{color:#e2e8f0}
.controls{max-width:1200px;margin:16px auto;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap}
.controls input{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px}
.controls input::placeholder{color:#64748b}
.controls select{padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:8px}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;background:#1e293b;color:#94a3b8;cursor:pointer;border:none;font-size:14px}
.tab.active{background:#0f172a;color:#4ade80;border-bottom:2px solid #4ade80}
.content{max-width:1200px;margin:0 auto;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#1e293b;padding:12px 8px;text-align:left;position:sticky;top:0;color:#94a3b8;font-weight:600}
td{padding:10px 8px;border-bottom:1px solid #1e293b}
tr:hover td{background:#1e293b}
.rank{color:#64748b;width:50px}
.addr{font-family:monospace;font-size:12px;color:#60a5fa;cursor:pointer}
.addr:hover{text-decoration:underline}
.bal{text-align:right;font-variant-numeric:tabular-nums}
.bal b{color:#4ade80}
.stake{font-size:12px;padding:3px 10px;border-radius:12px;white-space:nowrap}
.stake.s1{background:#14532d;color:#4ade80}
.stake.s2{background:#7c2d12;color:#fb923c}
.stake.s0{background:#334155;color:#94a3b8}
.loading{text-align:center;padding:60px;color:#64748b}
.error{text-align:center;padding:40px;color:#f87171}
.error button{margin-top:12px;padding:10px 24px;border-radius:8px;border:none;background:#4ade80;color:#0f172a;cursor:pointer;font-size:14px}
.activity-item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1e293b;font-size:13px;align-items:center;flex-wrap:wrap}
.activity-item .op{background:#1e293b;padding:4px 10px;border-radius:6px;font-size:12px}
.activity-item .op.mint{color:#4ade80}
.activity-item .op.transfer{color:#60a5fa}
.activity-item a{color:#60a5fa;font-family:monospace;font-size:12px}
.activity-item .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.updated{text-align:center;padding:12px;color:#475569;font-size:12px}
.pagination{display:flex;justify-content:center;gap:8px;margin:16px 0;flex-wrap:wrap;align-items:center}
.pagination button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.pagination button:hover{background:#334155}
.pagination button.active{background:#4ade80;color:#0f172a;border-color:#4ade80}
.pagination button:disabled{opacity:0.4;cursor:not-allowed}
.pagination .info{color:#64748b;font-size:13px}
.dash{background:#f8fafc;color:#1e293b;border-radius:16px;padding:32px;margin-bottom:16px}
.dash h2{font-size:14px;color:#64748b;margin-bottom:8px;font-weight:500}
.dash .total{font-size:56px;font-weight:700;margin-bottom:4px}
.dash .total-sub{font-size:14px;color:#64748b;margin-bottom:24px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.hourglass-wrap{text-align:center}
.hg-label{font-size:13px;color:#64748b;margin:8px 0}
.hg-pct{font-size:20px;font-weight:700}
.hg-pct.green{color:#15803d}
.hg-pct.brown{color:#b45309}
.dash-stats{display:flex;flex-direction:column;gap:16px}
.dash-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}
.dash-row .dot{width:10px;height:10px;border-radius:50%}
.dash-row .dot.green{background:#15803d}
.dash-row .dot.brown{background:#b45309}
.dash-row .name{font-size:15px}
.dash-row .addr-cnt{font-size:13px;color:#64748b;margin-left:8px}
.dash-row .val{margin-left:auto;font-size:22px;font-weight:700}
.dash-row .val.green{color:#15803d}
.dash-row .val.brown{color:#b45309}
.dash-nums{display:flex;gap:32px;margin:20px 0;flex-wrap:wrap}
.dash-num .n{font-size:24px;font-weight:700}
.dash-num .l{font-size:13px;color:#64748b}
.dash-conc{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.dash-conc .box{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px}
.dash-conc .box .l{font-size:13px;color:#64748b}
.dash-conc .box .v{font-size:22px;font-weight:700;margin-top:4px}
@media(max-width:640px){.dash-grid{grid-template-columns:1fr}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100}
.modal-content{background:#1e293b;margin:5% auto;padding:24px;border-radius:12px;max-width:700px;max-height:80vh;overflow-y:auto}
.modal-content h2{font-size:18px;margin-bottom:16px;word-break:break-all}
.modal-close{float:right;background:#334155;border:none;color:#e2e8f0;padding:8px 16px;border-radius:8px;cursor:pointer}
.modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.modal-stat{background:#0f172a;padding:12px;border-radius:8px}
.modal-stat .label{font-size:12px;color:#64748b}
.modal-stat .value{font-size:18px;color:#4ade80;margin-top:4px}
.tx-item{padding:10px;border-bottom:1px solid #334155;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tx-item a{color:#60a5fa;font-family:monospace;font-size:11px}
@media(max-width:640px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}
</style>
</head>
<body>
<div class="header">
<h1>🍂 <span>LEAF</span> 持仓榜</h1>
<div class="stats" id="stats"><span>加载中...</span></div>
</div>
<div class="controls">
<input type="text" id="search" placeholder="搜索地址...">
<select id="stakeFilter">
<option value="">全部状态</option>
<option value="1">质押中</option>
<option value="2">已解锁</option>
<option value="0">未知</option>
</select>
</div>
<div class="tabs">
<button class="tab active" id="tab-dash">数据概览</button>
<button class="tab" id="tab-holders">持仓排行</button>
<button class="tab" id="tab-activity">最新动态</button>
</div>
<div class="content">
<div id="dash-tab"></div>
<div id="holders-tab" style="display:none"></div>
<div id="activity-tab" style="display:none"></div>
</div>
<div class="updated" id="updated"></div>
<div class="modal" id="modal">
<div class="modal-content">
<button class="modal-close" id="modal-close">关闭</button>
<h2 id="modal-title"></h2>
<div class="modal-stats" id="modal-stats"></div>
<h3 style="margin-bottom:12px;font-size:14px;color:#94a3b8">最近交易记录</h3>
<div id="modal-txs"></div>
</div>
</div>
<script>
var DATA_URL = 'holders.json';
var STAKE_NAMES = ['未知', '质押中', '已解锁'];
var STAKE_CLASSES = ['s0', 's1', 's2'];
var PAGE_SIZE = 20;
var data = null;
var currentPage = 1;
var filteredRows = [];

function load() {
  document.getElementById('holders-tab').innerHTML = '<div class="loading">加载中...</div>';
  fetch(DATA_URL + '?t=' + Date.now()).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d) {
    data = d;
    render();
  }).catch(function(e) {
    document.getElementById('holders-tab').innerHTML = '<div class="error">加载失败: ' + e.message + '<br><button onclick="load()">重试</button></div>';
  });
}

function renderDash() {
  var el = document.getElementById('dash-tab');
  var s = data.stats || {};
  var total = data.ts || 1;
  var unmovedPct = (s.unmoved_bal / total * 100);
  var movedPct = (s.moved_bal / total * 100);
  // Hourglass: top triangle height proportional to unmoved, bottom to moved
  var topH = Math.max(10, Math.round(unmovedPct * 1.2));
  var botH = Math.max(10, Math.round(movedPct * 1.2));
  function yi(n) { return (n/1e8).toFixed(2) + '亿'; }
  var html = '<div class="dash">';
  html += '<h2>账本铸造总量</h2>';
  html += '<div class="total">' + (total/1e8).toFixed(2) + '亿</div>';
  html += '<div class="total-sub">' + Number(total).toLocaleString() + ' LEAF</div>';
  html += '<div class="dash-grid">';
  // Hourglass
  html += '<div class="hourglass-wrap">';
  html += '<div class="hg-label">未转移余额</div>';
  html += '<div class="hg-pct green">' + unmovedPct.toFixed(1) + '%</div>';
  html += '<svg width="180" height="240" viewBox="0 0 180 240">';
  // Top bulb (unmoved, green)
  html += '<path d="M20,20 L160,20 L90,110 Z" fill="#15803d" opacity="0.85"/>';
  // Bottom bulb (moved, brown)
  html += '<path d="M20,220 L160,220 L90,130 Z" fill="#b45309" opacity="0.85"/>';
  // Glass outline
  html += '<path d="M20,20 L160,20 L95,115 L160,220 L20,220 L85,115 Z" fill="none" stroke="#64748b" stroke-width="2"/>';
  // Top and bottom caps
  html += '<rect x="10" y="12" width="160" height="8" rx="2" fill="#15803d"/>';
  html += '<rect x="10" y="220" width="160" height="8" rx="2" fill="#475569"/>';
  // Sand dot in middle
  html += '<circle cx="90" cy="120" r="4" fill="#b45309"/>';
  html += '</svg>';
  html += '<div class="hg-label">已转移余额</div>';
  html += '<div class="hg-pct brown">' + movedPct.toFixed(1) + '%</div>';
  html += '</div>';
  // Stats
  html += '<div class="dash-stats">';
  html += '<div class="dash-row"><span class="dot green"></span><span class="name">未转移余额</span><span class="addr-cnt">' + s.unmoved_cnt + ' 个地址</span><span class="val green">' + yi(s.unmoved_bal) + '</span></div>';
  html += '<div class="dash-row"><span class="dot brown"></span><span class="name">已转移余额</span><span class="addr-cnt">' + s.moved_cnt + ' 个地址</span><span class="val brown">' + yi(s.moved_bal) + '</span></div>';
  html += '<div class="dash-nums">';
  html += '<div class="dash-num"><div class="n">' + data.th + '</div><div class="l">持仓地址</div></div>';
  html += '<div class="dash-num"><div class="n">' + s.mint_cnt + '</div><div class="l">mint</div></div>';
  html += '<div class="dash-num"><div class="n">' + s.transfer_cnt + '</div><div class="l">transfer</div></div>';
  html += '</div>';
  html += '<div class="dash-conc">';
  html += '<div class="box"><div class="l">TOP 10 集中度</div><div class="v">' + s.top10_pct + '%</div></div>';
  html += '<div class="box"><div class="l">TOP 3 集中度</div><div class="v">' + s.top3_pct + '%</div></div>';
  html += '</div>';
  html += '</div>'; // dash-stats
  html += '</div>'; // dash-grid
  html += '</div>'; // dash
  el.innerHTML = html;
}

function render() {
  renderDash();
  document.getElementById('stats').innerHTML =
    '<span>持仓地址 <b>' + data.th + '</b></span>' +
    '<span>总供应 <b>' + Number(data.ts).toLocaleString() + '</b></span>' +
    '<span>区块 <b>' + data.bh + '</b></span>';
  var d = new Date(data.u);
  document.getElementById('updated').textContent =
    '更新于 ' + d.toLocaleString('zh-CN') + ' · 每10分钟自动刷新';
  renderHolders();
  renderActivity();
}

function renderHolders() {
  var q = document.getElementById('search').value.toLowerCase();
  var sf = document.getElementById('stakeFilter').value;
  var el = document.getElementById('holders-tab');
  filteredRows = data.h;
  if (q) filteredRows = filteredRows.filter(function(h) { return h[0].toLowerCase().indexOf(q) >= 0; });
  if (sf !== '') filteredRows = filteredRows.filter(function(h) { return String(h[4]) === sf; });
  var totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  var start = (currentPage - 1) * PAGE_SIZE;
  var pageRows = filteredRows.slice(start, start + PAGE_SIZE);
  var html = '<table><tr><th>#</th><th>地址</th><th style="text-align:right">余额</th><th>状态</th><th>Mint</th><th>交易</th></tr>';
  pageRows.forEach(function(h, i) {
    var rank = start + i + 1;
    var short = h[0].slice(0,10) + '...' + h[0].slice(-8);
    var st = h[4] || 0;
    html += '<tr><td class="rank">' + rank + '</td>' +
      '<td><span class="addr" data-addr="' + h[0] + '">' + short + '</span></td>' +
      '<td class="bal"><b>' + Number(h[1]).toLocaleString() + '</b></td>' +
      '<td><span class="stake ' + STAKE_CLASSES[st] + '">' + STAKE_NAMES[st] + '</span></td>' +
      '<td>' + h[2] + '</td><td>' + h[3] + '</td></tr>';
  });
  html += '</table>';
  html += '<div class="pagination">';
  html += '<button data-pg="1"' + (currentPage===1?' disabled':'') + '>首页</button>';
  html += '<button data-pg="' + (currentPage-1) + '"' + (currentPage===1?' disabled':'') + '>上一页</button>';
  var pStart = Math.max(1, currentPage - 3);
  var pEnd = Math.min(totalPages, pStart + 6);
  if (pEnd - pStart < 6) pStart = Math.max(1, pEnd - 6);
  for (var p = pStart; p <= pEnd; p++) {
    html += '<button data-pg="' + p + '"' + (p===currentPage?' class="active"':'') + '>' + p + '</button>';
  }
  html += '<button data-pg="' + (currentPage+1) + '"' + (currentPage===totalPages?' disabled':'') + '>下一页</button>';
  html += '<button data-pg="' + totalPages + '"' + (currentPage===totalPages?' disabled':'') + '>末页</button>';
  html += '<span class="info">第 ' + currentPage + ' / ' + totalPages + ' 页，共 ' + filteredRows.length + ' 条</span>';
  html += '</div>';
  el.innerHTML = html;
  // Bind pagination buttons
  var btns = el.querySelectorAll('.pagination button[data-pg]');
  btns.forEach(function(b) {
    b.addEventListener('click', function() {
      var p = parseInt(b.getAttribute('data-pg'), 10);
      if (p >= 1 && p <= totalPages && p !== currentPage) {
        currentPage = p;
        renderHolders();
        window.scrollTo(0, 0);
      }
    });
  });
  // Bind address clicks
  var addrs = el.querySelectorAll('.addr[data-addr]');
  addrs.forEach(function(a) {
    a.addEventListener('click', function() { showDetail(a.getAttribute('data-addr')); });
  });
}

function renderActivity() {
  var el = document.getElementById('activity-tab');
  var html = '';
  (data.la || []).forEach(function(a) {
    html += '<div class="activity-item">' +
      '<span class="op ' + a[1] + '">' + a[1] + '</span>' +
      '<a href="https://mempool.space/tx/' + a[0] + '" target="_blank">' + a[0].slice(0,16) + '...</a>' +
      '<span style="color:#64748b">#' + (a[4] || '') + '</span>' +
      '<span class="amt">' + (a[3] ? Number(a[3]).toLocaleString() : '') + ' LEAF</span></div>';
  });
  el.innerHTML = html || '<div class="loading">暂无数据</div>';
}

function showDetail(addr) {
  var h = null;
  for (var i = 0; i < data.h.length; i++) { if (data.h[i][0] === addr) { h = data.h[i]; break; } }
  if (!h) return;
  var st = h[4] || 0;
  document.getElementById('modal-title').innerHTML = '<span class="addr">' + addr + '</span>';
  document.getElementById('modal-stats').innerHTML =
    '<div class="modal-stat"><div class="label">余额</div><div class="value">' + Number(h[1]).toLocaleString() + '</div></div>' +
    '<div class="modal-stat"><div class="label">状态</div><div class="value"><span class="stake ' + STAKE_CLASSES[st] + '">' + STAKE_NAMES[st] + '</span></div></div>' +
    '<div class="modal-stat"><div class="label">Mint 次数</div><div class="value">' + h[2] + '</div></div>' +
    '<div class="modal-stat"><div class="label">交易数</div><div class="value">' + h[3] + '</div></div>';
  var txs = (data.txs && data.txs[addr]) || [];
  var html = '';
  txs.forEach(function(t) {
    // t = [txid_short, op, amount, block, direction, is_trade]
    var dir = t[4] || '';
    var isTrade = t[5] === 1;
    var label, color;
    if (isTrade && dir === 'in') { label = '买入'; color = '#4ade80'; }
    else if (isTrade && dir === 'out') { label = '卖出'; color = '#fb923c'; }
    else if (dir === 'in') { label = '转入'; color = '#4ade80'; }
    else if (dir === 'out') { label = '转出'; color = '#fb923c'; }
    else if (dir === 'mint') { label = '铸造'; color = '#60a5fa'; }
    else { label = dir; color = '#64748b'; }
    html += '<div class="tx-item">' +
      '<span class="op ' + t[1] + '">' + t[1] + '</span>' +
      '<span style="color:' + color + ';font-weight:700">' + label + '</span>' +
      '<span style="color:#64748b">#' + (t[3] || '') + '</span>' +
      '<span>' + (t[2] ? Number(t[2]).toLocaleString() : '') + ' LEAF</span></div>';
  });
  document.getElementById('modal-txs').innerHTML = html || '<div style="color:#64748b">暂无交易记录</div>';
  document.getElementById('modal').style.display = 'block';
}

document.getElementById('modal-close').addEventListener('click', function() {
  document.getElementById('modal').style.display = 'none';
});
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  ['dash','holders','activity'].forEach(function(t) {
    document.getElementById(t+'-tab').style.display = t===name ? '' : 'none';
  });
}
document.getElementById('tab-dash').addEventListener('click', function() { switchTab('dash'); });
document.getElementById('tab-holders').addEventListener('click', function() { switchTab('holders'); });
document.getElementById('tab-activity').addEventListener('click', function() { switchTab('activity'); });
document.getElementById('search').addEventListener('input', function() { currentPage = 1; renderHolders(); });
document.getElementById('stakeFilter').addEventListener('change', function() { currentPage = 1; renderHolders(); });
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
